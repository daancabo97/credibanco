<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Lista de Tarjetas</h4>
        </div>
        <div class="card-body">
          <table class="table table-striped table-hover">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Número de Tarjeta</th>
                <th>Titular</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let tarjeta of tarjetas">
                <td>{{ tarjeta.id }}</td>
                <td>{{ tarjeta.numero }}</td>
                <td>{{ tarjeta.titular }}</td>
              </tr>
            </tbody>
          </table>
          <div class="text-center mt-3">
            <button (click)="cargarTarjetas()" class="btn btn-secondary btn-lg me-2">Actualizar Lista</button>
            <a routerLink="/tarjetas/nuevo" class="btn btn-success btn-lg">Crear Nueva Tarjeta</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
