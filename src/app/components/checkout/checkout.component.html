<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">Checkout</h4>
        </div>
        <div class="card-body">
          <h5>Resumen del Carrito</h5>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between" *ngFor="let item of cartItems">
              <span>{{ item.product.title }} (x{{ item.quantity }})</span>
              <span>${{ (item.product.price * item.quantity).toFixed(2) }}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between fw-bold">
              <span>Total</span>
              <span>${{ total.toFixed(2) }}</span>
            </li>
          </ul>

          <h5>Información de Pago</h5>
          <form (ngSubmit)="pagar()" #form="ngForm">
            <div class="mb-3">
              <label for="tarjeta" class="form-label">Seleccionar Tarjeta</label>
              <select
                class="form-control"
                id="tarjeta"
                [(ngModel)]="selectedTarjetaId"
                name="tarjeta"
                required
              >
                <option value="">Seleccione una tarjeta</option>
                <option *ngFor="let tarjeta of tarjetas" [value]="tarjeta.id">
                  **** **** **** {{ tarjeta.numero.slice(-4) }} - {{ tarjeta.titular }}
                </option>
              </select>
            </div>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre del Titular</label>
              <input
                type="text"
                class="form-control"
                id="nombre"
                [(ngModel)]="nombreTitular"
                name="nombre"
                required
              >
            </div>
            <div class="mb-3">
              <label for="numero" class="form-label">Número de Tarjeta</label>
              <input
                type="text"
                class="form-control"
                id="numero"
                [(ngModel)]="numeroTarjeta"
                name="numero"
                required
              >
            </div>
            <div class="mb-3">
              <label for="fecha" class="form-label">Fecha de Vencimiento</label>
              <input
                type="text"
                class="form-control"
                id="fecha"
                [(ngModel)]="fechaVencimiento"
                name="fecha"
                placeholder="MM/AA"
                required
              >
            </div>
            <button type="submit" class="btn btn-success btn-lg" [disabled]="form.invalid">Pagar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
