<div class="container mt-5">
  <!-- Carousel -->
  <div id="productCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://via.placeholder.com/800x300?text=Producto+1" class="d-block w-100" alt="Producto 1">
        <div class="carousel-caption d-none d-md-block">
          <h5>Descubre nuestros productos</h5>
          <p>La mejor calidad a precios increíbles</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://via.placeholder.com/800x300?text=Producto+2" class="d-block w-100" alt="Producto 2">
        <div class="carousel-caption d-none d-md-block">
          <h5>Ofertas especiales</h5>
          <p>Aprovecha descuentos exclusivos</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <div class="row">
    <div class="col-md-8">
      <h2>Marketplace</h2>
      <div class="mb-4">
        <input
          type="text"
          class="form-control"
          placeholder="Buscar productos por título..."
          [(ngModel)]="searchTerm"
          (input)="search()"
        >
      </div>
      <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let product of filteredProducts">
          <div class="card h-100">
            <img [src]="product.image" class="card-img-top" alt="Product image" style="height: 200px; object-fit: cover;">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">{{ product.title }}</h5>
              <p class="card-text text-muted">{{ product.category }}</p>
              <p class="card-text fw-bold">${{ product.price }}</p>
              <button class="btn btn-primary mt-auto" (click)="addToCart(product)">Agregar al Carrito</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <app-cart></app-cart>
    </div>
  </div>
</div>
