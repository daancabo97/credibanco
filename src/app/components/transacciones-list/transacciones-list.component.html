<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="card shadow">
        <div class="card-header bg-info text-white">
          <h4 class="mb-0">Lista de Transacciones</h4>
        </div>
        <div class="card-body">
          <table class="table table-striped table-hover">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>ID de Tarjeta</th>
                <th>Monto</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let tx of transacciones">
                <td>{{ tx.id }}</td>
                <td>{{ tx.tarjetaId }}</td>
                <td>${{ tx.monto }}</td>
                <td>{{ tx.descripcion }}</td>
                <td>{{ tx.estado }}</td>
                <td>{{ tx.fecha }}</td>
                <td><button (click)="anular(tx)" class="btn btn-danger btn-sm" *ngIf="tx.estado !== 'ANULADA'">Anular</button></td>
              </tr>
            </tbody>
          </table>
          <div class="text-center mt-3">
            <button (click)="cargarTransacciones()" class="btn btn-secondary btn-lg me-2">Actualizar Lista</button>
            <a routerLink="/transacciones/nuevo" class="btn btn-info btn-lg">Crear Nueva Transacción</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
